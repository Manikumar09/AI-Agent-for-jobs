[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-job-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<48", "python-docx>=1.1,<2", "pydantic>=2.7,<3", "PyYAML>=6,<7", "requests>=2.32,<3", "python-dotenv>=1,<2", "google-genai>=1,<3", "python-jobspy>=1.1.80,<2", "playwright>=1.49,<2", "openpyxl>=3.1,<4", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
job-agent = "jobagent.cli:main"

[tool.setuptools.packages.find]
include = ["jobagent*"]
